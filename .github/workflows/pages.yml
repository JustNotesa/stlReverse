# Veröffentlicht die Web-Version (dieselben Dateien wie das Add-on) auf GitHub Pages.
# Startseite = neuester Release-Tag, /live/ = aktueller main. Aufbau in .github/pages-build.sh.
# Läuft nur auf main (die Pages-Umgebung erlaubt nur main); nach einem Release-Tag einmal
# `gh workflow run pages.yml --ref main` anstoßen, damit die Startseite den neuen Tag zeigt.
name: Web-Version (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Seite zusammenstellen
        run: .github/pages-build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
